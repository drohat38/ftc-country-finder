<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Feed The Country · Find Your Event · September 19, 2026</title>
<meta name="description" content="Find your Feed The Country event on Saturday, September 19, 2026 and register on Eventbrite.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@googlemaps/markerclusterer@2.5.3/dist/index.min.js"></script>
<script src="config.js?v=11"></script>
<style>
/* Feed The Country Event Finder — same bones as the monthly Feed The City finder, Feed The Country identity:
   navy water, warm paper land, Ignite Orange pins, gold for "coming soon", Anton + Poppins like the site.
   This is a full-frame app meant to be embedded in Wix at a fixed height (640 px). */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}
*:focus:not(:focus-visible){outline:none}
[hidden]{display:none!important}
:root{
  --navy:#003366;--navy-dk:#00264D;--navy-2:#0B4F82;
  --sky:#39BAE4;--sky-lt:#E4F5FB;
  --orange:#FF6500;--orange-dk:#D95600;--orange-lt:#FFF1E8;
  --gold:#F2A71E;--gold-dk:#C98511;--gold-lt:#FFF4DC;
  --ink:#1F2D3D;--ink2:#3B4A5A;--ink3:#6B7A89;
  --border:#E1E6EC;--bg:#F4F6F8;--white:#fff;
  --shadow-1:0 1px 2px rgba(0,38,77,.18),0 2px 6px rgba(0,38,77,.10);
  --shadow-2:0 4px 14px rgba(0,38,77,.22),0 10px 30px rgba(0,38,77,.14);
  --panel-w:440px;
  --display:"Anton",Impact,"Arial Narrow Bold",sans-serif;
  --head:"Poppins","Segoe UI",system-ui,sans-serif;
  --body:"Avenir Next",Avenir,"Nunito Sans","Segoe UI",Helvetica,Arial,sans-serif;
}
html,body{height:100%;min-height:520px;font-family:var(--body);overflow:hidden;background:#0E2F52;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;font-size:inherit}

#map{position:fixed;inset:0;width:100vw;height:100vh;min-height:100vh;background:#0E2F52;z-index:0}

/* Left panel */
#panel{position:fixed;top:0;left:0;bottom:0;width:var(--panel-w);z-index:100;display:flex;flex-direction:column;pointer-events:none}
#search-area{pointer-events:auto;padding:12px 12px 0}

/* Brand card: the Feed The Country lockup + live tally */
#brand-bar{
  position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:12px 14px;margin-bottom:10px;
  background:linear-gradient(135deg,#003366 0%,#0B4F82 100%);border-radius:14px;box-shadow:var(--shadow-2);color:#fff;
}
#brand-bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 26px);pointer-events:none}
#brand-bar>*{position:relative;z-index:1}
.brand-lockup{display:block;width:118px;height:auto;flex-shrink:0;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
#tally{display:flex;gap:16px;margin-left:auto;align-items:flex-end}
.tally-item{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.tally-num{font-family:var(--display);font-size:30px;color:var(--gold);letter-spacing:.01em}
.tally-num.orange{color:#FF8A3D}
.tally-lbl{font-family:var(--head);font-weight:600;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.82);margin-top:4px}
#badge{display:none}

/* Search */
#search-box{display:flex;align-items:center;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:28px;box-shadow:var(--shadow-1);height:54px;padding:0 8px 0 16px;gap:8px;transition:box-shadow .2s}
#search-box:focus-within{box-shadow:var(--shadow-2)}
.srch-icon{color:var(--ink3);flex-shrink:0;display:flex}
#search-input{flex:1;border:none;outline:none;background:transparent;font-size:16px;font-weight:400;color:var(--ink);min-width:0}
#search-input::placeholder{color:var(--ink3)}
#search-clear{display:none;background:transparent;border:none;cursor:pointer;padding:4px;color:var(--ink3);border-radius:50%;width:32px;height:32px;align-items:center;justify-content:center}
#search-clear:hover{background:var(--bg)}
#search-clear.vis{display:flex}
#near-btn{background:transparent;border:none;cursor:pointer;width:36px;height:36px;border-radius:50%;color:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0}
#near-btn:hover{background:var(--sky-lt)}
#near-btn:disabled{opacity:.5;cursor:default}
#search-btn{background:var(--orange);color:#fff;border:none;border-radius:20px;height:38px;padding:0 18px;font-family:var(--head);font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;transition:background .15s;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
#search-btn:hover{background:var(--orange-dk)}

/* Toolbar */
#toolbar{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-shrink:0}
.tool-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:32px;padding:7px 12px;border-radius:18px;border:1px solid var(--border);background:#fff;color:var(--ink2);cursor:pointer;font-family:var(--head);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
.tool-btn:hover,.tool-btn.active{border-color:var(--orange);background:var(--orange-lt);color:var(--orange-dk)}
.tool-count{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;border-radius:10px;background:var(--orange);color:#fff;font-size:10px;font-weight:700;padding:0 6px}
.tool-count[hidden]{display:none}
#reset-btn{display:none}
#reset-btn.show{display:inline-flex}

/* Filter panel */
#filter-panel{pointer-events:auto;position:fixed;left:12px;top:150px;bottom:12px;width:calc(var(--panel-w) - 24px);z-index:260;background:rgba(255,255,255,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-2);display:flex;flex-direction:column;overflow:hidden;transform:translateX(calc(-100% - 24px));visibility:hidden;transition:transform .24s cubic-bezier(.4,0,.2,1),visibility .24s}
#filter-panel.open{transform:translateX(0);visibility:visible}
.fp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:15px 16px 11px;border-bottom:1px solid var(--border)}
.fp-title{font-family:var(--head);font-size:16px;font-weight:700;color:var(--navy);line-height:1.1}
.fp-subtitle{font-size:12.5px;color:var(--ink3);line-height:1.35;margin-top:4px}
.fp-subtitle a{color:var(--orange-dk);text-decoration:none;font-weight:700;margin-left:4px}
.fsec-question{font-family:var(--head);font-size:13px;font-weight:700;color:var(--ink);margin-bottom:4px;line-height:1.3}
.fsec-desc{font-size:12px;color:var(--ink3);margin-bottom:12px;line-height:1.45}
.fp-close{flex-shrink:0;width:34px;height:34px;border:0;border-radius:50%;background:var(--bg);color:var(--ink3);cursor:pointer;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center}
.fp-close:hover{background:var(--orange-lt);color:var(--orange-dk)}
.fp-body{padding:13px 16px;overflow-y:auto;flex:1}
.fp-summary{background:var(--navy);color:#fff;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-family:var(--head);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.fp-summary strong{font-family:var(--display);font-weight:400;font-size:18px;color:var(--gold);margin-right:4px}
.fsec{margin-bottom:17px}
.fopt-row{display:flex;flex-wrap:wrap;gap:7px}
.fopt{display:inline-flex;align-items:center;gap:6px;min-height:31px;padding:7px 10px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--ink2);cursor:pointer;font-family:var(--head);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;transition:background .12s,border-color .12s,color .12s}
.fopt:hover{border-color:var(--sky);background:var(--sky-lt);color:var(--navy)}
.fopt.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.fopt.k-live.sel{background:var(--orange);border-color:var(--orange)}
.fopt.k-soon.sel{background:var(--gold);border-color:var(--gold);color:var(--navy-dk)}
.fopt .fmeta{font-size:9px;font-weight:700;opacity:.72;border-left:1px solid currentColor;padding-left:6px}
.fp-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;border-top:1px solid var(--border)}
.fp-back-btn{border:0;background:transparent;color:var(--ink3);cursor:pointer;font-family:var(--head);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.fp-back-btn:hover{color:var(--orange-dk)}
.fp-done{border:0;background:var(--orange);color:#fff;border-radius:18px;min-height:36px;padding:8px 20px;cursor:pointer;font-family:var(--head);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.fp-done:hover{background:var(--orange-dk)}

/* Results */
#results-panel{pointer-events:auto;background:var(--white);flex:1;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-1);margin:8px 12px 12px;border-radius:14px}
#results-hd{padding:12px 16px 10px;border-bottom:1px solid var(--border);flex-shrink:0;cursor:default}
.results-hd-main{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.results-copy{flex:1;min-width:0}
#results-hd h2{font-family:var(--head);font-size:14px;font-weight:700;color:var(--navy);letter-spacing:0;line-height:1.25}
#results-hd h2 em{font-family:var(--display);font-style:normal;font-weight:400;font-size:20px;color:var(--orange);margin-right:2px;vertical-align:-1px}
#results-sub{font-size:12px;color:var(--ink3);margin-top:2px;line-height:1.35}
#results-sub a{color:var(--orange-dk);font-weight:700;text-decoration:none}
#cards-list{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#d6dce3 transparent}
#cards-list::-webkit-scrollbar{width:4px}
#cards-list::-webkit-scrollbar-thumb{background:#d6dce3;border-radius:2px}

/* Event card */
.ecard{display:flex;align-items:stretch;padding:13px 14px 13px 0;gap:0;cursor:pointer;border-bottom:1px solid #EEF1F4;transition:background .12s;background:#fff}
.ecard:last-child{border-bottom:none}
.ecard:hover{background:#FAFBFC}
.ecard.active{background:#FFF6EE;box-shadow:inset 0 0 0 1px rgba(255,101,0,.25)}
.ecard.active .etitle{color:var(--orange-dk)}
.ebar{width:4px;border-radius:0 3px 3px 0;flex-shrink:0;align-self:stretch;min-height:96px;margin-right:14px}
.ebar.sf{background:var(--orange)}.ebar.st{background:var(--gold)}
.ebody{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ehdr{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.etitle{font-family:var(--head);font-size:15.5px;font-weight:700;color:var(--navy);line-height:1.2;flex:1;min-width:0}
.epill{display:inline-flex;align-items:center;align-self:flex-start;font-family:var(--head);font-size:10px;font-weight:700;padding:3px 9px;border-radius:9px;color:#fff;letter-spacing:.06em;text-transform:uppercase;line-height:1.2}
.epill.sf{background:var(--orange)}.epill.st{background:var(--gold);color:var(--navy-dk)}
.einfo{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.einforow{display:grid;grid-template-columns:18px 1fr;align-items:start;gap:8px;font-size:13px;color:var(--ink2);line-height:1.35}
.einforow .eic{color:var(--ink3);display:flex;align-items:flex-start;justify-content:center;padding-top:1px}
.einforow strong{color:var(--ink);font-weight:700}
.einforow .eaddr{color:var(--ink3);font-size:12.5px;display:block;margin-top:1px}
.etime{font-family:var(--head);font-size:13px;font-weight:600;color:var(--ink)}
.edist{font-family:var(--head);font-size:11px;font-weight:700;color:var(--navy);background:var(--sky-lt);padding:3px 9px;border-radius:11px;white-space:nowrap;flex-shrink:0;line-height:1.4;letter-spacing:.03em}
.espots{font-family:var(--head);font-size:11px;font-weight:700;color:var(--orange-dk);background:var(--orange-lt);padding:3px 9px;border-radius:11px;white-space:nowrap;flex-shrink:0;line-height:1.4}
.espots.full{color:var(--ink3);background:var(--bg)}
.cap{margin-top:6px}
.cap-bar{height:6px;border-radius:3px;background:#EEF1F4;overflow:hidden}
.cap-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--orange),#FF8A3D);transition:width .5s ease}
.cap-fill.full{background:var(--ink3)}
.cap-txt{font-size:11.5px;color:var(--ink3);margin-top:4px}
.cap-txt strong{color:var(--ink);font-weight:700}
.eactions{display:flex;gap:8px;margin-top:8px}
.eact{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 14px;border-radius:9px;font-family:var(--head);font-size:11.5px;font-weight:700;text-decoration:none;border:1px solid var(--border);background:#fff;color:var(--navy);cursor:pointer;text-transform:uppercase;letter-spacing:.05em}
.eact.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.eact.primary:hover{background:var(--orange-dk)}

/* States, skeletons */
.smsg{padding:40px 20px;text-align:center;color:var(--ink3)}
.smsg h3{font-family:var(--head);font-size:16px;font-weight:700;color:var(--navy);margin-bottom:6px}
.smsg p{font-size:13px;line-height:1.5}
.smsg a{color:var(--orange-dk);font-weight:700}
.skeleton-card{display:flex;align-items:stretch;padding:14px 14px 14px 0;gap:0;border-bottom:1px solid #EEF1F4;background:#fff}
.skeleton-bar{width:4px;border-radius:0 3px 3px 0;flex-shrink:0;align-self:stretch;min-height:90px;margin-right:14px;background:#E8ECF0}
.skeleton-body{flex:1;display:flex;flex-direction:column;gap:10px;padding-top:4px}
.skeleton-line{height:12px;background:#E8ECF0;border-radius:4px;width:100%;animation:pulse 1.5s infinite ease-in-out}
.skeleton-line.short{width:50%}.skeleton-line.mid{width:75%}.skeleton-line.title{height:18px;width:60%;margin-bottom:4px}
@keyframes pulse{0%{opacity:.6}50%{opacity:1}100%{opacity:.6}}

/* Info window */
.gm-style-iw.gm-style-iw-c{padding:0!important;border-radius:14px!important;box-shadow:0 4px 18px rgba(0,38,77,.28)!important;max-width:320px!important}
.gm-style-iw-d{overflow:hidden!important;padding:0!important}
.gm-style-iw-chr{position:absolute!important;top:6px!important;right:6px!important;z-index:5!important}
.iwrap{width:308px;font-family:var(--body)}
.iwhd{padding:14px 38px 12px 16px;background:linear-gradient(135deg,#003366,#0B4F82);color:#fff;border-radius:14px 14px 0 0}
.iwname{font-family:var(--head);font-size:16px;font-weight:700;color:#fff;line-height:1.25;margin-bottom:8px}
.iwpill{display:inline-flex;align-items:center;font-family:var(--head);font-size:10px;font-weight:700;padding:3px 9px;border-radius:9px;color:#fff;letter-spacing:.06em;text-transform:uppercase;line-height:1.2}
.iwpill.sf{background:var(--orange)}.iwpill.st{background:var(--gold);color:var(--navy-dk)}
.iwdate{font-size:12px;color:rgba(255,255,255,.85);margin-top:8px}
.iwdate strong{color:#fff;font-weight:700}
.iwbody{padding:12px 16px 4px}
.iwrow{display:grid;grid-template-columns:18px 1fr;align-items:start;gap:10px;font-size:13px;color:var(--ink2);margin-bottom:9px;line-height:1.35}
.iwic{color:var(--ink3);display:flex;align-items:flex-start;justify-content:center;padding-top:1px}
.iwrow strong{color:var(--ink);font-weight:700}
.iwtime{font-family:var(--head);font-weight:600;color:var(--ink);font-size:13.5px}
.iwnote{color:var(--ink3);font-size:12.5px}
.iwact{display:flex;gap:8px;padding:10px 16px 12px;border-top:1px solid #EEF1F4}
.iwbtn{flex:1;text-align:center;padding:7px 10px;border-radius:9px;font-family:var(--head);font-size:11.5px;font-weight:700;text-decoration:none;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:#fff;color:var(--navy);cursor:pointer;text-transform:uppercase;letter-spacing:.05em;min-height:34px}
.iwbtn:hover{filter:brightness(.97)}
.iwbp{background:var(--orange);border-color:var(--orange);color:#fff}
.iwshare{flex:0 0 auto;width:38px;padding:0}
.iwshare.done{border-color:var(--sky);color:var(--navy)}

/* Notify me form */
.nform{width:100%}
.nform-label{font-size:12px;color:var(--ink2);margin-bottom:6px;line-height:1.35}
.nform-row{display:flex;gap:6px}
.nform-row input{flex:1;min-width:0;height:34px;border:1px solid var(--border);border-radius:8px;padding:0 10px;font-size:13px;color:var(--ink);background:#fff}
.nform-row input:focus{border-color:var(--orange);outline:none}
.nform-row button{height:34px;padding:0 12px;border:0;border-radius:8px;background:var(--orange);color:#fff;font-family:var(--head);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;white-space:nowrap}
.nform-row button:disabled{opacity:.6;cursor:default}
.nform-hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.nform-msg{font-size:11.5px;margin-top:5px;color:var(--ink3)}
.nform-msg.err{color:#C5221F}
.nform-done{font-size:12.5px;color:#1E7E34;font-weight:700;padding:6px 0}

/* Map messages */
.mapmsg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;font-family:var(--body);padding:24px;background:white;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.15);max-width:360px;margin-left:calc(var(--panel-w)/2)}
.mapmsg h3{font-family:var(--head);color:var(--navy);margin-bottom:8px;font-size:16px}
.mapmsg p{color:#5f6368;font-size:13px;line-height:1.5}
.mapmsg strong{color:var(--ink)}
.attrib{position:fixed;right:8px;bottom:6px;z-index:5;font-size:10px;color:rgba(255,255,255,.7);pointer-events:none}

#place-sheet{display:none}

/* MOBILE */
@media(max-width:700px){
  #panel{width:100%;flex-direction:column;justify-content:space-between;bottom:auto;height:100%}
  #search-area{padding:10px 10px 0;position:relative;z-index:3}
  #brand-bar{padding:8px 12px;gap:10px;margin-bottom:8px;border-radius:12px}
  .brand-lockup{width:86px}
  #tally{gap:12px}
  .tally-num{font-size:22px}
  .tally-lbl{font-size:8.5px}
  #search-box{height:48px;border-radius:26px;padding:0 6px 0 12px}
  #search-input{font-size:15px}
  #search-btn{display:none}
  #toolbar{gap:5px}
  .tool-btn{min-height:30px;padding:7px 10px;font-size:9.5px}
  .tool-btn svg{width:14px;height:14px}
  #filter-panel{left:10px;right:10px;top:130px;bottom:10px;width:auto;border-radius:14px}
  #results-panel{position:fixed;left:0;right:0;bottom:0;margin:0;border-radius:18px 18px 0 0;height:76vh;max-height:none;flex:none;transform:translateY(calc(100% - 92px));transition:transform .28s cubic-bezier(.4,0,.2,1),height .28s cubic-bezier(.4,0,.2,1);box-shadow:0 -3px 14px rgba(0,38,77,.25);will-change:transform}
  #results-panel[data-sheet="peek"]{transform:translateY(calc(100% - 92px))}
  #results-panel[data-sheet="half"]{transform:translateY(34vh)}
  #results-panel[data-sheet="full"]{height:calc(100vh - 76px);transform:translateY(0)}
  #sheet-handle{display:block;width:100%;height:24px;cursor:grab;flex-shrink:0;position:relative;touch-action:none}
  #sheet-handle::before{content:"";position:absolute;left:50%;top:10px;transform:translateX(-50%);width:36px;height:4px;background:#D6DCE3;border-radius:2px}
  #results-hd{padding:8px 14px 6px}
  #results-hd h2{font-size:13px}
  #results-sub{font-size:11px}
  #cards-list{padding-bottom:18px}
  .ecard{padding:13px 14px 13px 0}
  .eactions{display:none}
  .attrib{display:none}
  body.place-mode #results-panel{transform:translateY(110%)!important}
  #place-sheet{display:block;position:fixed;left:0;right:0;bottom:0;z-index:260;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -4px 18px rgba(0,38,77,.28);transform:translateY(110%);transition:transform .28s cubic-bezier(.4,0,.2,1);visibility:hidden;pointer-events:auto;overflow:hidden}
  #place-sheet.show{transform:translateY(0);visibility:visible}
  .ps-handle{width:38px;height:4px;background:#D6DCE3;border-radius:3px;margin:10px auto 6px}

const STATE_LABELS={AL:"Alabama",AK:"Alaska",AZ:"Arizona",AR:"Arkansas",CA:"California",CO:"Colorado",CT:"Connecticut",DE:"Delaware",FL:"Florida",GA:"Georgia",HI:"Hawaii",ID:"Idaho",IL:"Illinois",IN:"Indiana",IA:"Iowa",KS:"Kansas",KY:"Kentucky",LA:"Louisiana",ME:"Maine",MD:"Maryland",MA:"Massachusetts",MI:"Michigan",MN:"Minnesota",MS:"Mississippi",MO:"Missouri",MT:"Montana",NE:"Nebraska",NV:"Nevada",NH:"New Hampshire",NJ:"New Jersey",NM:"New Mexico",NY:"New York",NC:"North Carolina",ND:"North Dakota",OH:"Ohio",OK:"Oklahoma",OR:"Oregon",PA:"Pennsylvania",RI:"Rhode Island",SC:"South Carolina",SD:"South Dakota",TN:"Tennessee",TX:"Texas",UT:"Utah",VT:"Vermont",VA:"Virginia",WA:"Washington",WV:"West Virginia",WI:"Wisconsin",WY:"Wyoming"};
// Feed The Country map style: navy water, warm paper land, quiet roads. Pins do the talking.
const MAP_STYLE=[{"elementType":"geometry","stylers":[{"color":"#F3F0E7"}]},{"elementType":"labels.text.fill","stylers":[{"color":"#4A5A6A"}]},{"elementType":"labels.text.stroke","stylers":[{"color":"#FFFFFF"},{"weight":2}]},{"elementType":"labels.icon","stylers":[{"visibility":"off"}]},{"featureType":"poi","stylers":[{"visibility":"off"}]},{"featureType":"transit","stylers":[{"visibility":"off"}]},{"featureType":"road","elementType":"geometry","stylers":[{"color":"#FFFFFF"}]},{"featureType":"road","elementType":"geometry.stroke","stylers":[{"color":"#E6E1D3"}]},{"featureType":"road.highway","elementType":"geometry","stylers":[{"color":"#EDE7D6"}]},{"featureType":"road.highway","elementType":"geometry.stroke","stylers":[{"color":"#DCD4BE"}]},{"featureType":"road","elementType":"labels","stylers":[{"visibility":"simplified"}]},{"featureType":"road.local","elementType":"labels","stylers":[{"visibility":"off"}]},{"featureType":"water","elementType":"geometry","stylers":[{"color":"#0E2F52"}]},{"featureType":"water","elementType":"labels.text.fill","stylers":[{"color":"#8FBEDF"}]},{"featureType":"water","elementType":"labels.text.stroke","stylers":[{"visibility":"off"}]},{"featureType":"administrative.country","elementType":"geometry.stroke","stylers":[{"color":"#A9B5C1"}]},{"featureType":"administrative.province","elementType":"geometry.stroke","stylers":[{"color":"#C5CED8"},{"weight":1}]},{"featureType":"administrative.locality","elementType":"labels.text.fill","stylers":[{"color":"#2F3F4F"}]},{"featureType":"landscape.natural","elementType":"geometry","stylers":[{"color":"#F3F0E7"}]},{"featureType":"landscape.man_made","elementType":"geometry","stylers":[{"color":"#EDEAE1"}]},{"featureType":"poi.park","elementType":"geometry","stylers":[{"color":"#E1EBDA"},{"visibility":"on"}]}];
let map,clusterer=null,all=[],fil=[],sLoc=null,sLabel="",sMatch=null,aId=null,oIW=null,sPin=null,sheetState=SHEET.PEEK,settings={},dataSource="";
const selectedStates=new Set(),selectedKinds=new Set();
const REFRESH_MS=Number(CFG.refreshMs)||600000;
let _suppressFit=false,_lastRefresh=0,_refreshTimer=null,_refreshInFlight=false,_mapReady=false,_dataReady=false,_deepLinked=false;
const _geocodeCache=new Map();
const DAYS=(function(){const p=String(CFG.eventDate||"").split("-").map(Number);if(p.length!==3||p.some(isNaN))return null;const t=new Date(p[0],p[1]-1,p[2]);const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/86400000)})();
const AFTER=DAYS!==null&&DAYS<0, TODAY=DAYS===0;

const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const mob=()=>window.innerWidth<=700;
const norm=s=>String(s||"").toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").trim().replace(/\s+/g," ");
const compact=s=>norm(s).replace(/\s+/g,"");
const safeUrl=u=>/^https?:\/\//i.test(String(u||""))?String(u).trim():"";
function baseCity(city){return String(city||"").replace(/\s*\([^)]*\)\s*/g," ").trim()}
function setting(k,fb){const v=settings[k];return v!==undefined&&v!==""?v:fb}
function stateFromQuery(q){const n=compact(norm(q).replace(/\b(united states|usa|us)\b/g," "));return STATES[n]||null}
function cityTermFromQuery(q){let parts=norm(q).replace(/\b(united states|usa|us)\b/g," ").trim().split(/\s+/).filter(Boolean);if(parts.length>1&&STATES[compact(parts[parts.length-1])])parts.pop();return parts.join(" ")}
function findLocalSearch(q){
  const raw=String(q||"").trim(),qn=norm(raw);if(!qn)return null;
  const cityTerm=cityTermFromQuery(raw),cityKey=compact(cityTerm);
  if(cityKey){
    let matches=all.filter(e=>compact(e.city)===cityKey||compact(baseCity(e.city))===cityKey);
    if(!matches.length&&cityKey.length>=4)matches=all.filter(e=>{const c=compact(baseCity(e.city));return c.includes(cityKey)||cityKey.includes(c)});
    if(matches.length)return{type:"text",label:raw,ids:new Set(matches.map(e=>e.id))};
  }
  const state=stateFromQuery(raw);
  if(state){const inState=all.some(e=>e.state===state);if(inState)return{type:"state",state,label:STATE_LABELS[state]||state}}
  if(qn.length>=3){const matches=all.filter(e=>norm([e.city,e.state,e.venue,e.address,e.host].join(" ")).includes(qn));if(matches.length)return{type:"text",label:raw,ids:new Set(matches.map(e=>e.id))}}
  return null;
}
function clearSearchOnly(){document.getElementById("search-input").value="";document.getElementById("search-clear").classList.remove("vis");sLoc=null;sMatch=null;sLabel="";if(sPin){sPin.setMap(null);sPin=null}}
function hasFilters(){return selectedStates.size||selectedKinds.size}
function activeFilterCount(){return selectedStates.size+selectedKinds.size}
function matchesFilters(e){if(selectedStates.size&&!selectedStates.has(e.state))return false;if(selectedKinds.size&&!selectedKinds.has(e.live?"live":"soon"))return false;return true}
function filterLabel(){const parts=[];if(selectedStates.size)parts.push([...selectedStates].map(s=>STATE_LABELS[s]||s).join(", "));if(selectedKinds.size)parts.push([...selectedKinds].map(k=>KIND[k].label).join(", "));return parts.join(" + ")}
function setFilterPanel(open){const panel=document.getElementById("filter-panel");panel.classList.toggle("open",open);panel.setAttribute("aria-hidden",String(!open));document.getElementById("filter-toggle").setAttribute("aria-expanded",String(open));document.getElementById("filter-toggle").classList.toggle("active",open||hasFilters());if(open)renderFilters()}
function updateToolbar(){const n=activeFilterCount();const count=document.getElementById("filter-count");count.hidden=n===0;count.textContent=n;document.getElementById("filter-toggle").classList.toggle("active",n>0||document.getElementById("filter-panel").classList.contains("open"));document.getElementById("reset-btn").classList.toggle("show",n>0||!!sLoc||!!sMatch)}
function poolForFilters(){return all.filter(matchesFilters)}
function filterButton({type,value,label,meta,cls=""}){const set=type==="state"?selectedStates:selectedKinds;const sel=set.has(value);return`<button class="fopt ${cls}${sel?" sel":""}" type="button" data-filter-type="${type}" data-filter-value="${esc(value)}" aria-pressed="${sel?"true":"false"}">${esc(label)}${meta?`<span class="fmeta">${esc(meta)}</span>`:""}</button>`}
function renderFilters(){
  document.getElementById("filter-result-count").textContent=poolForFilters().length;
  const counts={};all.forEach(e=>{counts[e.state]=(counts[e.state]||0)+1});
  const states=Object.keys(counts).sort((a,b)=>(STATE_LABELS[a]||a).localeCompare(STATE_LABELS[b]||b));
  document.getElementById("state-options").innerHTML=states.map(s=>filterButton({type:"state",value:s,label:STATE_LABELS[s]||s,meta:String(counts[s])})).join("");
  const live=all.filter(e=>e.live).length,soon=all.length-live;
  document.getElementById("kind-options").innerHTML=filterButton({type:"kind",value:"live",label:KIND.live.label,meta:String(live),cls:"k-live"})+filterButton({type:"kind",value:"soon",label:KIND.soon.label,meta:String(soon),cls:"k-soon"});
  const n=poolForFilters().length;document.getElementById("filter-done").textContent=`Show ${n} ${n===1?"event":"events"}`;
  updateToolbar();
}
function toggleFilter(type,value){const set=type==="state"?selectedStates:selectedKinds;if(set.has(value))set.delete(value);else set.add(value);renderFilters();applyFil();if(mob())setSheet(SHEET.HALF)}

function setupSheet(){
  const panel=document.getElementById("results-panel"),handle=document.getElementById("sheet-handle"),header=document.getElementById("results-hd");
  const cycle=()=>setSheet(sheetState===SHEET.PEEK?SHEET.HALF:sheetState===SHEET.HALF?SHEET.FULL:SHEET.PEEK);
  handle.addEventListener("click",cycle);
  header.addEventListener("click",()=>{if(mob()&&sheetState===SHEET.PEEK)setSheet(SHEET.HALF)});
  let startY=0,lastY=0,dragging=false,startSheet=null;
  const onMove=e=>{if(!dragging)return;lastY=e.clientY;const dy=lastY-startY;panel.style.transition="none";const base=startSheet===SHEET.FULL?0:startSheet===SHEET.HALF?window.innerHeight*0.34:window.innerHeight-92;const next=Math.max(0,Math.min(window.innerHeight-92,base+dy));panel.style.transform=`translateY(${next}px)`};
  const onEnd=e=>{if(!dragging)return;dragging=false;panel.style.transition="";panel.style.transform="";const dy=(e.clientY||lastY)-startY;if(dy<-35)setSheet(startSheet===SHEET.PEEK?SHEET.HALF:SHEET.FULL);else if(dy>35)setSheet(startSheet===SHEET.FULL?SHEET.HALF:SHEET.PEEK);else setSheet(startSheet)};

function setSheet(state){sheetState=state;document.getElementById("results-panel").dataset.sheet=state}

/* ---------------- data: Eventbrite feed first; Sheet "Coming soon" tab adds cities; Events tab as fallback/overrides; seed last ---------------- */
function fetchJson(url){return fetch(url+(url.includes("?")?"&":"?")+"_="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})}
function fetchCsvRows(url){return fetch(url+(url.includes("?")?"&":"?")+"_="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}).then(t=>Papa.parse(t,{header:true,skipEmptyLines:true}).data)}
function fromApi(e){const lat=parseFloat(e.lat),lng=parseFloat(e.lng);return{id:"eb"+String(e.id),city:String(e.city||"").trim(),state:String(e.state||"").trim().toUpperCase(),venue:String(e.venue||"").trim(),address:String(e.address||"").trim(),time:tidyTime(e.time),url:safeUrl(e.url),live:!!e.live&&!!safeUrl(e.url),host:"",registered:num(e.registered),capacity:num(e.capacity),lat:isFinite(lat)?lat:null,lng:isFinite(lng)?lng:null,paused:false}}
function fromSheet(r){
  const city=String(r.City||"").trim(),state=String(r.State||"").trim().toUpperCase();if(!city||!state)return null;
  const lat=parseFloat(r.Latitude),lng=parseFloat(r.Longitude),url=safeUrl(r.EventbriteURL);
  const paused=["yes","true"].includes(String(r.Paused||"").trim().toLowerCase())||String(r.Status||"").trim().toLowerCase()==="hidden";
  return{id:"sh"+compact(city+"|"+state),city,state,venue:String(r.Venue||"").trim(),address:String(r.Address||"").trim(),time:tidyTime(r.Time),url,live:!!url,host:String(r.Host||"").trim(),registered:num(r.Registered),capacity:num(r.Capacity),lat:isFinite(lat)?lat:null,lng:isFinite(lng)?lng:null,paused};
}
function fromComingSoon(r){
  const city=String(r.City||"").trim(),state=String(r.State||"").trim().toUpperCase();if(!city||!state)return null;
  const lat=parseFloat(r.Latitude),lng=parseFloat(r.Longitude);
  const hidden=["yes","true"].includes(String(r.Hide||r.Paused||"").trim().toLowerCase());
  return{id:"cs"+compact(city+"|"+state),city,state,venue:String(r.Venue||"").trim(),address:String(r.Address||"").trim(),time:"",url:"",live:false,host:String(r.Host||"").trim(),note:String(r.Note||"").trim(),registered:null,capacity:null,lat:isFinite(lat)?lat:null,lng:isFinite(lng)?lng:null,paused:hidden};
}
function num(v){const n=parseInt(v,10);return isFinite(n)&&n>=0?n:null}
function tidyTime(t){return String(t||"").trim().replace(/\s*-\s*/g," - ").replace(/\s+/g," ")}
function keyOf(e){return compact(baseCity(e.city))+"|"+e.state+"|"+compact(String(e.city).replace(baseCity(e.city),""))}
function mergeSources(api,sheet,soon){
  // Eventbrite is the truth for venue, time, link and counts. The Events tab can add a Host, hide a city (Paused) or fill
  // coordinates a draft lacks. The Coming soon tab adds cities with no Eventbrite event yet; an Eventbrite event wins.
  const out=[],byKey=new Map();
  (api||[]).forEach(e=>{byKey.set(keyOf(e),e);out.push(e)});
  (sheet||[]).forEach(s=>{if(!s)return;const k=keyOf(s),hit=byKey.get(k);
    if(hit){if(s.host)hit.host=s.host;if(s.paused)hit.paused=true;if(hit.lat===null&&s.lat!==null){hit.lat=s.lat;hit.lng=s.lng}if(!hit.venue&&s.venue)hit.venue=s.venue;if(!hit.address&&s.address)hit.address=s.address;if(!hit.time&&s.time)hit.time=s.time;if(!hit.live&&s.url){hit.url=s.url;hit.live=true}}
    else if(!api||!s.paused){byKey.set(k,s);out.push(s)}});
  (soon||[]).forEach(s=>{if(!s)return;const k=keyOf(s);if(byKey.has(k))return;byKey.set(k,s);out.push(s)});
  return out.filter(e=>!e.paused&&e.city&&e.state).map(e=>{const kind=e.live?KIND.live:KIND.soon;e.ck=kind.ck;e.color=kind.color;return e});
}
function loadData(isRefresh){
  const apiP=CFG.apiUrl?fetchJson(CFG.apiUrl).then(j=>{if(!j||!j.ok||!Array.isArray(j.events))throw new Error(j&&j.message||"feed unavailable");return j.events.map(fromApi)}).catch(err=>{console.warn("Eventbrite feed unavailable:",err&&err.message);return null}):Promise.resolve(null);
  const sheetP=CFG.sheetCsvUrl?fetchCsvRows(CFG.sheetCsvUrl).then(rows=>rows.map(fromSheet)).catch(()=>null):Promise.resolve(null);
  const soonP=CFG.comingSoonUrl?fetchCsvRows(CFG.comingSoonUrl).then(rows=>rows.map(fromComingSoon)).catch(()=>null):Promise.resolve(null);
  const setP=CFG.settingsUrl?fetchCsvRows(CFG.settingsUrl).then(rows=>{const o={};rows.forEach(r=>{const k=String(r.Key||r.key||"").trim().toLowerCase(),v=String(r.Value||r.value||"").trim();if(k)o[k]=v});return o}).catch(()=>({})):Promise.resolve({});
  return Promise.all([apiP,sheetP,soonP,setP]).then(async([api,sheet,soon,set])=>{
    settings=set||{};
    let rows;
    if(api&&api.length){rows=mergeSources(api,sheet,soon);dataSource="eventbrite"}
    else if(sheet&&sheet.length){rows=mergeSources(null,sheet,soon);dataSource="sheet"}
    else{const seed=await fetchCsvRows(CFG.seedUrl).then(r=>r.map(fromSheet));rows=mergeSources(null,seed,soon);dataSource="seed"}
    if(!rows.length)throw new Error("No events in the data");
    if(isRefresh)swapDataset(rows);else{all=rows;_dataReady=true;if(_mapReady)afterData()}
  }).catch(err=>{if(!isRefresh)showLoadError(err&&err.message?err.message:"The event list could not be loaded.")});
}
function afterData(){renderTally();mkMarkers();renderFilters();applyFil();fitUS();markRefreshed();startAutoRefresh();deepLink()}
function deepLink(){
  if(_deepLinked)return;_deepLinked=true;
  let q="";try{q=new URLSearchParams(location.search).get("city")||""}catch(e){}
  if(!q)return;
  const key=compact(q);const ev=all.find(e=>compact(e.city)===key||compact(baseCity(e.city))===key);
  if(ev)setTimeout(()=>activate(ev.id,true),400);
}
function showSkeleton(){document.getElementById("cards-list").innerHTML=`<div class="skeleton-card"><div class="skeleton-bar"></div><div class="skeleton-body"><div class="skeleton-line title"></div><div class="skeleton-line mid"></div><div class="skeleton-line short"></div></div></div><div class="skeleton-card"><div class="skeleton-bar"></div><div class="skeleton-body"><div class="skeleton-line title"></div><div class="skeleton-line mid"></div><div class="skeleton-line short"></div></div></div>`}
function showLoadError(message){
  document.getElementById("rc").textContent="Could not load";
  document.getElementById("results-sub").textContent="Event data failed";
  document.getElementById("cards-list").innerHTML=`<div class="smsg"><h3>Could not load events</h3><p>${esc(message)}</p><p style="margin-top:14px"><button id="retry-load-btn" class="tool-btn" type="button" style="display:inline-flex">Try again</button></p></div>`;
  const btn=document.getElementById("retry-load-btn");if(btn)btn.addEventListener("click",()=>{showSkeleton();loadData(false)});
}
function refreshData(){if(_refreshInFlight)return;_refreshInFlight=true;loadData(true).finally(()=>{_refreshInFlight=false})}
function swapDataset(next){
  if(!next||!next.length){markRefreshed("error");return}
  const prevAct=aId,wasIWOpen=!!oIW;
  if(clusterer){clusterer.clearMarkers()}
  all.forEach(e=>{if(e.marker){e.marker.setMap(null);if(e.iw)e.iw.close()}});
  all=next;mkMarkers();renderTally();renderFilters();
  _suppressFit=true;try{applyFil()}finally{_suppressFit=false}
  if(prevAct){const still=all.find(e=>e.id===prevAct);if(still){aId=prevAct;if(still.marker&&still.iconBig)still.marker.setIcon(still.iconBig);hlCard(prevAct);if(wasIWOpen&&!mob()&&still.iw&&still.marker){still.iw.open(map,still.marker);oIW=still.iw}}else{aId=null;if(oIW)oIW.close();oIW=null;hidePlaceSheet(false)}}
  markRefreshed("ok");
}
function renderTally(){
  const states=new Set(all.map(e=>e.state));
  const vol=all.reduce((s,e)=>s+(e.registered||0),0);
  document.getElementById("t-cities").textContent=all.length;
  document.getElementById("t-states").textContent=states.size;
  const vw=document.getElementById("t-vol-wrap");vw.hidden=!(vol>0);if(vol>0)document.getElementById("t-vol").textContent=vol.toLocaleString();
  const d=document.getElementById("t-days"),dl=document.getElementById("t-days-lbl");
  if(DAYS===null){d.textContent="—";dl.textContent="Sept 19"}
  else if(AFTER){d.textContent="✓";dl.textContent="Sept 19 done"}
  else if(TODAY){d.textContent="Today";dl.textContent="Let's go"}
  else{d.textContent=DAYS;dl.textContent=DAYS===1?"Day to go":"Days to go"}
}
function markRefreshed(state){if(state!=="error")_lastRefresh=Date.now()}
function startAutoRefresh(){if(_refreshTimer)clearInterval(_refreshTimer);_refreshTimer=setInterval(()=>{if(document.visibilityState==="hidden")return;if(Date.now()-_lastRefresh>=REFRESH_MS-1000)refreshData()},60000);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&Date.now()-_lastRefresh>REFRESH_MS)refreshData()})}

function mkIcon(color,scale=1,soon=false){const w=Math.round(32*scale),h=Math.round(42*scale);const svg=`<svg width="${w}" height="${h}" viewBox="0 0 36 46" xmlns="http://www.w3.org/2000/svg"><defs><filter id="s" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,.35)"/></filter></defs><g filter="url(#s)"><path d="M18 2C9.7 2 3 8.7 3 17c0 11 15 27 15 27s15-16 15-27C33 8.7 26.3 2 18 2z" fill="${color}" stroke="${soon?"#fff":"rgba(0,0,0,.15)"}" stroke-width="${soon?2:1}"${soon?' stroke-dasharray="3 2"':""}/><circle cx="18" cy="17" r="7" fill="rgba(255,255,255,.94)"/><circle cx="18" cy="17" r="3.5" fill="${color}"/></g></svg>`;return{url:"data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg),scaledSize:new google.maps.Size(w,h),anchor:new google.maps.Point(w/2,h)}}
function clusterIcon(count,soonOnly){const d=count>=30?56:count>=10?48:40;const svg=`<svg width="${d}" height="${d}" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><circle cx="30" cy="30" r="29" fill="${soonOnly?"#F2A71E":"#FF6500"}" fill-opacity=".28"/><circle cx="30" cy="30" r="22" fill="${soonOnly?"#F2A71E":"#FF6500"}" stroke="#fff" stroke-width="3"/></svg>`;return{url:"data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg),scaledSize:new google.maps.Size(d,d),anchor:new google.maps.Point(d/2,d/2)}}
function mkMarkers(){
  all.forEach(ev=>{if(ev.lat===null||ev.lng===null)return;
    ev.icon=mkIcon(ev.color,1,!ev.live);ev.iconBig=mkIcon(ev.color,1.35,!ev.live);
    const m=new google.maps.Marker({position:{lat:ev.lat,lng:ev.lng},map:null,title:`${ev.city}, ${ev.state}`,icon:ev.icon,optimized:false});
    m.ftcLive=ev.live;ev.marker=m;
    const iw=new google.maps.InfoWindow({content:mkIW(ev),disableAutoPan:false,pixelOffset:new google.maps.Size(0,-6)});ev.iw=iw;
    iw.addListener("closeclick",()=>{oIW=null;resetActive();aId=null;hlCard(null)});
    m.addListener("click",()=>activate(ev.id,true));
  });
  if(!clusterer&&window.markerClusterer){
    clusterer=new markerClusterer.MarkerClusterer({map,markers:[],
      algorithm:new markerClusterer.SuperClusterAlgorithm({radius:34,maxZoom:9,minPoints:3}),
      renderer:{render:({count,position,markers})=>{const soonOnly=markers.every(mk=>!mk.ftcLive);return new google.maps.Marker({position,icon:clusterIcon(count,soonOnly),label:{text:String(count),color:soonOnly?"#00264D":"#fff",fontFamily:"Poppins, sans-serif",fontWeight:"700",fontSize:count>=10?"14px":"13px"},zIndex:Number(google.maps.Marker.MAX_ZINDEX)+count,title:`${count} events here — tap to zoom in`})}},
      onClusterClick:(e,cluster,mp)=>{if(oIW)oIW.close();oIW=null;const b=cluster.bounds;mp.fitBounds(b,{top:60,right:60,bottom:60,left:mob()?60:450});if(mp.getZoom()>14)mp.setZoom(14)}
    });
  }
}

/* ---------------- search ---------------- */
function onSrchBtn(){
  const v=document.getElementById("search-input").value.trim();
  if(!v)return clrSrch();
  const local=findLocalSearch(v);
  if(local)return doLocalSearch(local,v);
  if(!window.google||!google.maps){showSearchNote("Map search is unavailable right now. Try a state name.");return}
  const key=v.toLowerCase(),hit=_geocodeCache.get(key);
  if(hit){doSrch(hit.loc,hit.label);return}
  new google.maps.Geocoder().geocode({address:v,componentRestrictions:{country:"US"}},(res,st)=>{
    if(st==="OK"&&res[0]){
      if((res[0].types||[]).includes("country")){showSearchNote("Try a city, state, or ZIP code.");return}
      const loc=res[0].geometry.location,label=res[0].formatted_address||v;
      _geocodeCache.set(key,{loc,label});doSrch(loc,label);
    }else showSearchNote("We couldn't find that place. Try a different city or ZIP.");
  });
}
function showSearchNote(msg){document.getElementById("rc").textContent="No match";document.getElementById("results-sub").textContent=msg;if(mob())setSheet(SHEET.HALF)}
function doLocalSearch(match,label){sMatch=match;sLoc=null;sLabel=label||match.label||"";document.getElementById("search-input").value=sLabel;document.getElementById("search-clear").classList.add("vis");if(sPin){sPin.setMap(null);sPin=null}applyFil();if(mob())setSheet(SHEET.HALF)}
function doSrch(loc,label){sLoc=loc;sMatch=null;sLabel=label;document.getElementById("search-input").value=label;document.getElementById("search-clear").classList.add("vis");if(sPin)sPin.setMap(null);sPin=new google.maps.Marker({position:loc,map,zIndex:9999,icon:{path:google.maps.SymbolPath.CIRCLE,scale:9,fillColor:"#003366",fillOpacity:1,strokeColor:"#fff",strokeWeight:3},title:"Your search"});applyFil();if(mob())setSheet(SHEET.HALF)}
function nearMe(){
  if(!navigator.geolocation){showSearchNote("Your browser can't share your location. Type your ZIP instead.");return}
  const btn=document.getElementById("near-btn");btn.disabled=true;
  navigator.geolocation.getCurrentPosition(p=>{btn.disabled=false;doSrch(new google.maps.LatLng(p.coords.latitude,p.coords.longitude),"your location")},()=>{btn.disabled=false;showSearchNote("Location is off or was denied. Type your ZIP or city instead.")},{timeout:8000,maximumAge:300000});
}
function clrSrch(){clearSearchOnly();if(oIW)oIW.close();if(aId){resetActive();aId=null;hlCard(null)}oIW=null;hidePlaceSheet(false);if(mob())setSheet(SHEET.PEEK);applyFil();if(!hasFilters())fitUS()}
function resetAll(){selectedStates.clear();selectedKinds.clear();setFilterPanel(false);clrSrch()}

function baseResultPool(){
  let pool=all.filter(matchesFilters);
  if(sMatch){if(sMatch.type==="state")pool=pool.filter(e=>e.state===sMatch.state);else if(sMatch.ids)pool=pool.filter(e=>sMatch.ids.has(e.id))}
  if(sLoc){pool.forEach(e=>{if(e.lat===null){e.dm=Number.MAX_SAFE_INTEGER;e.dmi=null;return}const d=google.maps.geometry.spherical.computeDistanceBetween(sLoc,new google.maps.LatLng(e.lat,e.lng));e.dm=d;e.dmi=d*0.000621371});pool.sort((a,b)=>a.dm-b.dm);pool=pool.slice(0,TOP)}
  else pool.forEach(e=>{e.dm=null;e.dmi=null});
  return pool;
}
function applyFil(){
  const pool=baseResultPool();
  fil=pool;
  const vis=new Set(pool.map(e=>e.id));
  const visible=all.filter(e=>e.marker&&vis.has(e.id)).map(e=>e.marker);
  if(clusterer){clusterer.clearMarkers(true);clusterer.addMarkers(visible)}
  else all.forEach(e=>{if(e.marker)e.marker.setMap(vis.has(e.id)?map:null)});
  if(aId&&!vis.has(aId)){if(oIW)oIW.close();resetActive();aId=null;oIW=null;hidePlaceSheet(false)}
  if(!_suppressFit){
    const withPos=pool.filter(e=>e.lat!==null);
    if((sLoc||sMatch||hasFilters())&&withPos.length){const b=new google.maps.LatLngBounds();withPos.forEach(e=>b.extend({lat:e.lat,lng:e.lng}));if(sLoc)b.extend(sLoc);map.fitBounds(b,{top:60,right:60,bottom:60,left:mob()?60:450})}
  }
  renderFilters();render();
}
function render(){
  const rc=document.getElementById("rc"),rs=document.getElementById("results-sub");
  const soon=fil.filter(e=>!e.live).length,live=fil.length-soon;
  if(sMatch&&sMatch.type==="state"){rc.innerHTML=`<em>${fil.length}</em> ${esc(sMatch.label)} events`;rs.textContent=soon?`${soon} coming soon · clear search to see nationwide`:"Clear search to see nationwide"}
  else if(sMatch){rc.innerHTML=`<em>${fil.length}</em> events matching "${esc(sLabel.length>22?sLabel.slice(0,22)+"...":sLabel)}"`;rs.textContent="Only matching pins are shown"}
  else if(sLoc){rc.innerHTML=`<em>${fil.length}</em> nearest events`;rs.textContent="Closest to "+(sLabel.length>34?sLabel.slice(0,34)+"...":sLabel)}
  else if(hasFilters()){rc.innerHTML=`<em>${fil.length}</em> filtered events`;rs.textContent=filterLabel()||"Filters active"}
  else if(AFTER){rc.innerHTML=`Thank you for showing up`;rs.innerHTML=`Feed The Country is done for this year. <a href="${esc(CFG.monthlyFinderUrl||"#")}" target="_blank" rel="noopener">Find a monthly Feed The City event →</a>`}
  else if(TODAY){rc.innerHTML=`<em>${fil.length}</em> events packing meals today`;rs.textContent="Find yours and head over. Registration stays open until each event starts."}
  else{rc.innerHTML=`<em>${fil.length}</em> Feed The Country events`;rs.textContent=(soon?`${live} open for registration · ${soon} coming soon · `:"")+"Search a city or ZIP to find one near you"}

  const cl=document.getElementById("cards-list");
  if(!fil.length){cl.innerHTML='<div class="smsg"><h3>No events match</h3><p>Try a different city, ZIP, or filter.</p></div>';return}
  cl.innerHTML=fil.map(ev=>{
    const left=ev.live&&ev.capacity&&ev.registered!==null?ev.capacity-ev.registered:null;
    const di=ev.dmi!=null?`<div class="edist">${ev.dmi.toFixed(ev.dmi<10?1:0)} mi</div>`:(left!==null?`<div class="espots${left<=0?" full":""}">${left>0?`${left} spot${left===1?"":"s"} left`:"Full"}</div>`:"");
    return`<div class="ecard" data-id="${esc(ev.id)}">
      <div class="ebar ${ev.ck}"></div>
      <div class="ebody">
        <div class="ehdr"><h3 class="etitle">${esc(ev.city)}, ${esc(ev.state)}</h3>${di}</div>
        <span class="epill ${ev.ck}">${ev.live?KIND.live.label:KIND.soon.label}</span>
        <div class="einfo">
          ${ev.time?`<div class="einforow"><span class="eic">${ICON_TIME}</span><span class="etime">${esc(CFG.eventShort||"Sat, Sept 19")} · ${esc(ev.time)}</span></div>`:(ev.live?`<div class="einforow"><span class="eic">${ICON_TIME}</span><span class="etime">${esc(CFG.eventShort||"Sat, Sept 19")}</span></div>`:"")}
          ${ev.venue||ev.address?`<div class="einforow"><span class="eic">${ICON_PIN}</span><span>${ev.venue?`<strong>${esc(ev.venue)}</strong>`:""}${ev.address?`<span class="eaddr">${esc(ev.address)}</span>`:""}</span></div>`:`<div class="einforow"><span class="eic">${ICON_PIN}</span><span class="eaddr">${ev.live?"Venue details on Eventbrite":esc(ev.note||"Host is confirming the venue and time")}</span></div>`}
          ${ev.host?`<div class="einforow"><span class="eic">${ICON_USER}</span><span>Hosted by <strong>${esc(ev.host)}</strong></span></div>`:""}
        </div>
        ${capacityBar(ev)}
        <div class="eactions">${actionButtons(ev,"eact","primary")}</div>
      </div>
    </div>`;
  }).join("");
  cl.querySelectorAll(".ecard").forEach(c=>c.addEventListener("click",e=>{if(e.target.closest("a,button,form"))return;activate(c.dataset.id,false)}));
  hlCard(aId);
}
function activate(id,fromPin){
  const ev=all.find(e=>e.id===id);if(!ev)return;
  if(oIW)oIW.close();resetActive();aId=id;
  if(ev.marker&&ev.iconBig)ev.marker.setIcon(ev.iconBig);
  if(ev.lat!==null){map.panTo({lat:ev.lat,lng:ev.lng});if(map.getZoom()<12)map.setZoom(13)}
  const openIt=()=>{if(mob()){oIW=null;showPlaceSheet(ev)}else if(ev.iw&&ev.marker){ev.iw.open(map,ev.marker);oIW=ev.iw;hidePlaceSheet(false)}};
  // When the pin is inside a cluster the clusterer needs a tick to re-render before the window can attach.
  setTimeout(openIt,fromPin?0:180);
  hlCard(id);
  if(fromPin&&!mob()){const c=document.querySelector(`.ecard[data-id="${id}"]`);if(c)c.scrollIntoView({behavior:"smooth",block:"nearest"})}
  if(mob())setSheet(SHEET.PEEK);
}
function hlCard(id){document.querySelectorAll(".ecard").forEach(c=>c.classList.toggle("active",c.dataset.id===id))}
function resetActive(){if(!aId)return;const prev=all.find(e=>e.id===aId);if(prev&&prev.marker&&prev.icon)prev.marker.setIcon(prev.icon)}
function showPlaceSheet(ev){
  const ps=document.getElementById("place-sheet");if(!ps)return;
  const bring=setting("what_to_bring",CFG.whatToBring||"");const sc=signupCount(ev);
  ps.innerHTML=`<div class="ps-handle"></div>
    <div class="ps-top"><button class="ps-close" type="button" aria-label="Close event details">&times;</button>
      <div class="ps-title">${esc(ev.city)}, ${esc(ev.state)}</div>
      <span class="iwpill ${ev.ck}">${ev.live?KIND.live.label:KIND.soon.label}</span>
      <div class="ps-upcoming"><strong>${esc(CFG.eventLabel||"Saturday, September 19, 2026")}</strong>${ev.time?` · <span class="ps-time">${esc(ev.time)}</span>`:""}</div>
    </div>
    <div class="ps-body">
      ${ev.venue||ev.address?`<div class="ps-row"><div class="ps-ic">${ICON_PIN}</div><div>${ev.venue?`<strong>${esc(ev.venue)}</strong><br>`:""}${esc(ev.address)}</div></div>`:`<div class="ps-row"><div class="ps-ic">${ICON_PIN}</div><div class="ps-note">${ev.live?"Venue details on Eventbrite":esc(ev.note||"Host is confirming the venue and time")}</div></div>`}
      ${ev.host?`<div class="ps-row"><div class="ps-ic">${ICON_USER}</div><div>Hosted by <strong>${esc(ev.host)}</strong></div></div>`:""}
      ${sc?`<div class="ps-row"><div class="ps-ic">${ICON_GROUP}</div><div>${esc(sc)}</div></div>`:""}
      ${bring&&ev.live&&!AFTER?`<div class="ps-row"><div class="ps-ic">${ICON_CART}</div><div class="ps-note">${esc(bring)}</div></div>`:""}
    </div>
    <div class="ps-actions">${actionButtons(ev,"ps-btn","primary")}</div>`;
  ps.querySelector(".ps-close").addEventListener("click",()=>hidePlaceSheet(true));
  ps.classList.add("show");ps.setAttribute("aria-hidden","false");document.body.classList.add("place-mode");
}
function hidePlaceSheet(returnToList){const ps=document.getElementById("place-sheet");if(!ps)return;ps.classList.remove("show");ps.setAttribute("aria-hidden","true");document.body.classList.remove("place-mode");if(returnToList&&mob())setSheet(SHEET.HALF)}
function fitUS(){const pts=all.filter(e=>e.lat!==null);if(!pts.length||!map)return;const b=new google.maps.LatLngBounds();pts.forEach(e=>b.extend({lat:e.lat,lng:e.lng}));map.fitBounds(b,{top:40,right:40,bottom:40,left:mob()?40:450})}

window.initMap=initMap;
window.gm_authFailure=function(){document.getElementById("map").style.background="#F8D7DA";document.getElementById("map").innerHTML='<div class="mapmsg"><h3>Map key needs this site</h3><p>The Google Maps key is restricted to certain websites. Add <strong>'+esc(location.origin)+'/*</strong> to the key\'s allowed referrers in Google Cloud Console, or pass another key with <strong>?k=</strong>. The event list still works.</p></div>'};
wireUi();
loadData(false);
</script>
<script>
window._mapsTimeout=setTimeout(()=>{if(!window.google||!google.maps){document.getElementById("map").innerHTML='<div class="mapmsg"><h3>Map did not load</h3><p>Google Maps could not start. The event list still works. Check that the Maps JavaScript API and Geocoding API are enabled for the key, and that this site is in the key\'s allowed referrers.</p></div>'}},10000);
</script>
<script>
(function(){
  var key=new URLSearchParams(window.location.search).get("k")||(window.FTC_COUNTRY_CONFIG&&window.FTC_COUNTRY_CONFIG.googleMapsKey)||"";
  var s=document.createElement("script");s.async=true;
  s.src="https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(key)+"&libraries=geometry&loading=async&v=weekly&callback=initMap";
  document.head.appendChild(s);
})();
</script>
