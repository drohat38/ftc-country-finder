[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Let Wix and tangocharities.org frame this page, nobody else.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors https://tangocharities.org https://www.tangocharities.org https://*.wix.com https://*.wixsite.com https://*.filesusr.com https://*.editorx.io"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Never let a stale copy of the app linger in a browser or on the CDN edge.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/seed/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
